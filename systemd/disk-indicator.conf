# Disk-Indicator configuration used by the system service.
#
# One indicator per line, in format:
#   led=<provider>|<name> event=<read|write|both> device=<name>
#
# Remove the leading "# " from a line to enable it, then restart the service:
#   systemctl restart disk-indicator
#
# Do not leave empty lines in this file, reading stops at the first one.
#
# X.Org provider can not be used from system service, as it needs graphical session.
#
# Scroll lock LED on all keyboards, works on Wayland, X.Org and text console:
# led=e|scroll event=both device=sda
#
# Single keyboard, find yours with: ls /dev/input/by-id/ | grep event-kbd
# led=e|/dev/input/by-id/usb-My_Keyboard-event-kbd|scroll event=both device=sda
#
# Two disks sharing one LED:
# led=e|scroll event=both device=sda
# led=e|scroll event=both device=nvme0n1
#
# Text console:
# led=c|tty1|scroll event=both device=sda
#
# ThinkPad power LED:
# led=t|0 event=both device=sda
